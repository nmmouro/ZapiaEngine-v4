<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <!-- ========================================================
         CONFIGURAÇÕES
    ========================================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Painel Frota - Sistema de gerenciamento de frota"
    >

    <title>Painel Frota</title>


    <!-- ========================================================
         CSS
    ========================================================= -->

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <link
        rel="stylesheet"
        href="./css/components.css"
    >

</head>


<body data-page="home">


    <!-- ========================================================
         CABEÇALHO
    ========================================================= -->

    <header
        data-header
        class="app-header"
    ></header>


    <!-- ========================================================
         APLICAÇÃO
    ========================================================= -->

    <main
        id="app"
        class="app-container"
    >

        <!-- ====================================================
             MENU PRINCIPAL
        ==================================================== -->

        <section
            class="menu-home"
            aria-label="Menu principal"
        >


            <!-- ================================================
                 VEÍCULOS
            ================================================= -->

            <a
                href="./veiculos.html"
                class="menu-card"
            >

                <span
                    class="menu-card-icon"
                    aria-hidden="true"
                >
                    🚗
                </span>

                <span
                    class="menu-card-title"
                >
                    Veículos
                </span>

                <span
                    class="menu-card-description"
                >
                    Cadastro e gerenciamento dos veículos
                </span>

            </a>


            <!-- ================================================
                 EMPREGADOS
            ================================================= -->

            <a
                href="./empregados.html"
                class="menu-card"
            >

                <span
                    class="menu-card-icon"
                    aria-hidden="true"
                >
                    👤
                </span>

                <span
                    class="menu-card-title"
                >
                    Empregados
                </span>

                <span
                    class="menu-card-description"
                >
                    Cadastro e gerenciamento dos empregados
                </span>

            </a>


            <!-- ================================================
                 ABASTECIMENTOS
            ================================================= -->

            <a
                href="./abastecimentos.html"
                class="menu-card"
            >
                <span class="menu-card-icon" aria-hidden="true">⛽</span>
                <span class="menu-card-title">Abastecimentos</span>
                <span class="menu-card-description">Controle de abastecimento e combustível</span>
            </a>


            <!-- ================================================
                 LANÇAMENTOS
            ================================================= -->

            <a
                href="./lancamentos.html"
                class="menu-card"
            >

                <span
                    class="menu-card-icon"
                    aria-hidden="true"
                >
                    📋
                </span>

                <span
                    class="menu-card-title"
                >
                    Lançamentos
                </span>

                <span
                    class="menu-card-description"
                >
                    Controle das ocorrências e utilização
                    dos veículos
                </span>

            </a>


            <!-- ================================================
                 DASHBOARD
            ================================================= -->

            <a
                href="./dashboard.html"
                class="menu-card"
            >

                <span
                    class="menu-card-icon"
                    aria-hidden="true"
                >
                    📊
                </span>

                <span
                    class="menu-card-title"
                >
                    Dashboard
                </span>

                <span
                    class="menu-card-description"
                >
                    Visão geral da frota
                </span>

            </a>


        </section>

    </main>


    <!-- ========================================================
         APP PRINCIPAL
    ========================================================= -->

    <script
        type="module"
        src="./js/app.js"
    ></script>


    <!-- ========================================================
         HEADER
    ========================================================= -->

    <script type="module">

        import {
            iniciarHeader
        } from "./js/components/header.js";


        iniciarHeader({

            logo: "./assets/logo.png",

            tituloPadrao: "Painel Frota"

        });

    </script>


</body>

</html>
