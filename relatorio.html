<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Painel Frota - Relatório de ocorrências">
    <title>Relatório de Ocorrências - Painel Frota</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .relatorio-page{padding:20px;max-width:100%;box-sizing:border-box}
        .relatorio-cabecalho{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}
        .relatorio-cabecalho h1{margin:0 0 6px}.relatorio-cabecalho p{margin:0;opacity:.75}
        .relatorio-acoes{display:flex;gap:8px;flex-wrap:wrap}.relatorio-acoes button{cursor:pointer}
        .relatorio-filtros{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px;padding:16px;border:1px solid #ddd;border-radius:10px;background:#fafafa}
        .campo-relatorio{display:flex;flex-direction:column;gap:5px}.campo-relatorio label{font-weight:600;font-size:.88rem}.campo-relatorio input,.campo-relatorio select{min-height:38px;padding:7px 9px;border:1px solid #ccc;border-radius:6px;background:#fff;box-sizing:border-box;width:100%}.campo-largo{grid-column:span 1}
        .relatorio-mensagem{margin:12px 0;padding:10px 12px;border-radius:7px}.relatorio-mensagem.info{background:#eef5ff}.relatorio-mensagem.sucesso{background:#edf8ef}.relatorio-mensagem.erro{background:#fff0f0;color:#9b1c1c}
        .relatorio-resumo{display:flex;gap:14px;margin:14px 0}.relatorio-resumo>div{padding:12px 18px;border:1px solid #ddd;border-radius:8px;min-width:160px}.relatorio-resumo span{display:block;font-size:.82rem;opacity:.7}.relatorio-resumo strong{display:block;font-size:1.25rem;margin-top:4px}
        .relatorio-tabela-wrap{overflow:auto;border:1px solid #ddd;border-radius:8px;background:#fff}.relatorio-tabela{border-collapse:collapse;width:max-content;min-width:100%}.relatorio-tabela th,.relatorio-tabela td{padding:8px 10px;border-bottom:1px solid #e5e5e5;text-align:left;vertical-align:top;white-space:nowrap;max-width:360px}.relatorio-tabela th{position:sticky;top:0;background:#f3f3f3;z-index:1}.relatorio-tabela td{white-space:normal;min-width:90px}.relatorio-vazio{text-align:center!important;padding:30px!important;min-width:700px!important}
        @media(max-width:1100px){.relatorio-filtros{grid-template-columns:repeat(3,minmax(160px,1fr))}.relatorio-cabecalho{flex-direction:column}}
        @media(max-width:650px){.relatorio-filtros{grid-template-columns:1fr}.relatorio-resumo{flex-direction:column}}
        @media print{header,.relatorio-acoes,.relatorio-filtros,.relatorio-mensagem{display:none!important}.relatorio-page{padding:0}.relatorio-tabela{font-size:8px}.relatorio-tabela th{position:static}.relatorio-tabela-wrap{border:0;overflow:visible}}
    </style>
</head>
<body data-page="relatorio" data-page-title="Relatório de Ocorrências">
    <header data-header class="app-header"></header>
    <main id="app" class="app-container"></main>
    <script type="module" src="./js/app.js"></script>
    <script type="module">
        import { iniciarHeader } from "./js/components/header.js";
        iniciarHeader({ logo: "./assets/logo.png", tituloPadrao: "Painel Frota" });
    </script>
</body>
</html>
